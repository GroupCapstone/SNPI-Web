area:backend:
  - changed-files:
      - any-glob-to-any-file: 'apps/backend/**'

area:frontend:
  - changed-files:
      - any-glob-to-any-file: 'apps/frontend/**'

area:shared:
  - changed-files:
      - any-glob-to-any-file: 'packages/shared/**'

area:infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/backend/infrastructure/**'
          - 'docker-compose.yml'
          - 'Dockerfile'

area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'

area:documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'apps/*/README.md'
          - 'docs/**'
