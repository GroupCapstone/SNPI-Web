name: Private Network Deployment & Integration

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_smoke_tests:
        description: 'Execute internal private smoke tests'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-private-networking:
    name: Private VNet Pre-Flight Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Azure Private Networking Architecture
        run: npm run verify:private-network

  internal-service-integration:
    name: Internal VNet Workload Execution
    needs: validate-private-networking
    # Targets the Azure VNet injected larger runner group
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies & Linux Native Bindings
        run: |
          npm ci
          npm install --no-save \
            @rolldown/binding-linux-x64-gnu@1.2.15 \
            lightningcss-linux-x64-gnu@1.33.0 \
            @tailwindcss/oxide-linux-x64-gnu@4.3.3 \
            --workspace=apps/backend --workspace=apps/frontend

      - name: Monorepo Typecheck & Build
        run: |
          npm run typecheck
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Execute Internal Smoke & API Tests
        if: ${{ github.event.inputs.run_smoke_tests == 'true' || github.event_name == 'push' }}
        run: |
          echo "[VNET] Running internal API test suite over private network..."
          npm run test:api
        env:
          NODE_ENV: test
          PORT: 5001
