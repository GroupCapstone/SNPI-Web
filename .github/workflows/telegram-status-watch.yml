name: Telegram Repository Status & Security Watcher

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, closed, reopened]
  release:
    types: [published]
  workflow_run:
    workflows: ['Web Portal CI', 'Security & Compliance Audit']
    types: [completed]

permissions:
  contents: read
  security-events: read

jobs:
  telegram-alert:
    name: Dispatch Telegram Real-Time Alert
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Extract Metadata & Dispatch Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT__TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_HASH: ${{ github.sha }}
          ACTOR_NAME: ${{ github.event.head_commit.author.name || github.actor }}
          ACTOR_EMAIL: ${{ github.event.head_commit.author.email || 'developer@snpi.edu.kh' }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || 'Automated repository workflow sync' }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_ACTION: ${{ github.event.action }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # 1. Resolve Version from package.json
          PKG_VERSION=$(node -p "require('./package.json').version || '0.0.0'")

          # 2. Resolve Developer & Commit Info
          SHORT_HASH="${COMMIT_HASH:0:7}"
          DEV_NAME="${ACTOR_NAME}"
          DEV_EMAIL="${ACTOR_EMAIL}"
          COMMIT_MSG=$(echo "$RAW_COMMIT_MSG" | head -n 1)

          # 3. Resolve Security Quality Alerts (Dependabot)
          OPEN_ALERTS=0
          if command -v gh >/dev/null 2>&1; then
            OPEN_ALERTS=$(gh api "repos/${REPO_NAME}/dependabot/alerts" --jq '[.[] | select(.state=="open")] | length' 2>/dev/null || echo "0")
          fi
          SEC_SUMMARY="All security checks clean"
          if [ "$OPEN_ALERTS" -gt 0 ]; then
            SEC_SUMMARY="${OPEN_ALERTS} advisories under review"
          fi

          # 4. Human-readable timestamp
          HUMAN_TIME=$(date -u +'%d %b %Y, %I:%M %p UTC')

          # 5. Determine Event Type & Format Payload
          if [ "$EVENT_NAME" = "release" ]; then
            MESSAGE="<b>[SNPI · RELEASE] ${RELEASE_TAG}</b>%0A<b>Production Checkpoint Published</b>%0A%0A• <b>Developer:</b> ${DEV_NAME}%0A• <b>Package:</b> <code>v${PKG_VERSION}</code>%0A• <b>Security:</b> ${SEC_SUMMARY}%0A• <b>Release:</b> <a href=\"https://github.com/${REPO_NAME}/releases/tag/${RELEASE_TAG}\">Release Checkpoint</a>%0A• <b>Time:</b> ${HUMAN_TIME}"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            MESSAGE="<b>[SNPI · PR #${PR_NUMBER}] ${PR_ACTION^^}</b>%0A<b>${PR_TITLE}</b>%0A%0A• <b>Developer:</b> ${PR_AUTHOR}%0A• <b>Branch:</b> <code>${PR_HEAD_REF}</code> &rarr; <code>${PR_BASE_REF}</code>%0A• <b>Review:</b> <a href=\"https://github.com/${REPO_NAME}/pull/${PR_NUMBER}\">Pull Request Details</a>%0A• <b>Time:</b> ${HUMAN_TIME}"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            MESSAGE="<b>[SNPI · CI ${RUN_CONCLUSION^^}] ${RUN_WORKFLOW_NAME}</b>%0A<b>Automated Verification Completed</b>%0A%0A• <b>Developer:</b> ${DEV_NAME}%0A• <b>Commit:</b> <code>${SHORT_HASH}</code>%0A• <b>Security:</b> ${SEC_SUMMARY}%0A• <b>Pipeline:</b> <a href=\"https://github.com/${REPO_NAME}/actions/runs/${RUN_ID}\">Workflow Run Details</a>%0A• <b>Time:</b> ${HUMAN_TIME}"
          else
            MESSAGE="<b>[SNPI · REPO PUSH]</b> <code>${BRANCH_NAME}</code> · <b>v${PKG_VERSION}</b>%0A<b>${COMMIT_MSG}</b>%0A%0A• <b>Developer:</b> ${DEV_NAME}%0A• <b>Commit:</b> <code>${SHORT_HASH}</code>%0A• <b>Security:</b> ${SEC_SUMMARY}%0A• <b>Release:</b> <a href=\"https://github.com/${REPO_NAME}/releases\">Release Notes</a>%0A• <b>Time:</b> ${HUMAN_TIME}"
          fi

          # 6. Dispatch to Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" >/dev/null
          echo "Telegram notification sent successfully to chat ${TELEGRAM_CHAT_ID}."
