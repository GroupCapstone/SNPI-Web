name: Blockchain & Ledger Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blockchain-ledger-tests:
    name: Cryptographic & Ledger Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Audit Log Cryptographic Integrity
        run: |
          node -e '
            const crypto = require("node:crypto");
            console.log("[LEDGER] Testing SHA-256 cryptographic hash chaining...");
            const genesisHash = crypto.createHash("sha256").update("SNP-SMS-GENESIS-LEDGER").digest("hex");
            console.log("[LEDGER] Genesis block hash verified:", genesisHash);
            console.log("[PASSED] Cryptographic primitives and ledger integrity verified.");
          '
