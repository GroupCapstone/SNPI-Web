name: Feature Request
description: Propose a new feature, domain module, or architectural improvement
title: '[FEATURE]: '
labels: ['enhancement', 'proposal']
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new feature for the SNP-SMS platform.

  - type: dropdown
    id: workspace
    attributes:
      label: Target Workspace
      description: Where will this feature reside?
      options:
        - 'apps/backend (Express 5 Domain Module)'
        - 'apps/frontend (Next.js Feature Slice)'
        - 'packages/shared (@snp/shared DTO / RBAC)'
        - 'Infrastructure / Security / CI'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem?
      placeholder: A clear and concise description of the problem or limitation...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new capabilities you would like to see.
      placeholder: Detailed description of the proposed architectural or functional addition...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
