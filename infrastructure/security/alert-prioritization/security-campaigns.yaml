# Security Remediation Campaigns Configuration
# Standard: Greg Mohler & Tom Horton Alert Prioritization Architecture
# Step 3: Target High-Priority Alerts with Focused, Time-Bound Campaigns

schemaVersion: '1.0'
organization: 'Tan-Saphea'
repository: 'SNPI-SMS'

campaigns:
  - id: 'CAMP-2026-01-ACTIVE-SECRETS'
    title: 'Zero Active Secrets Remediation Campaign'
    description: 'Eliminate all active/confirmed provider secrets (AWS, OpenAI, GitHub App tokens) immediately'
    targetType: 'secret_scanning'
    filter:
      validity: 'active'
      patternType: 'provider_pattern'
    priority: 'P0'
    remediationSloDays: 7
    assignedSquad: 'security-champions-platform'
    escalationContact: 'security-board@snpi.edu.kh'
    autoTriageEnabled: true
    status: 'active'

  - id: 'CAMP-2026-02-CRITICAL-AUTOFIX'
    title: 'Critical CodeQL Autofix Quick-Win Campaign'
    description: 'Remediate critical and high severity CodeQL alerts that provide verified Copilot Autofix suggestions'
    targetType: 'code_scanning'
    filter:
      severity: ['critical', 'high']
      hasCopilotAutofix: true
      exposure: 'internet_facing'
    priority: 'P1'
    remediationSloDays: 14
    assignedSquad: 'backend-core'
    escalationContact: 'appsec-leads@snpi.edu.kh'
    autoTriageEnabled: true
    status: 'active'

  - id: 'CAMP-2026-03-RUNTIME-EPSS-SUPPLYCHAIN'
    title: 'High-EPSS Runtime Dependency Remediation Campaign'
    description: 'Patch runtime production dependencies with EPSS score >= 0.20 or active in-the-wild exploits'
    targetType: 'dependabot'
    filter:
      scope: 'runtime'
      minEpssScore: 0.20
      patchAvailable: true
    priority: 'P1'
    remediationSloDays: 14
    assignedSquad: 'devops-infrastructure'
    escalationContact: 'devsecops@snpi.edu.kh'
    autoTriageEnabled: true
    status: 'active'

  - id: 'CAMP-2026-04-TRANSITIVE-TECH-DEBT'
    title: 'Quarterly Transitive Dependency Tech Debt Burndown'
    description: 'Audit and override vulnerable transitive dependencies across development and test workspaces'
    targetType: 'dependabot'
    filter:
      relationship: 'transitive'
      scope: 'development'
    priority: 'P3'
    remediationSloDays: 90
    assignedSquad: 'quality-engineering'
    escalationContact: 'qa-lead@snpi.edu.kh'
    autoTriageEnabled: false
    status: 'scheduled'
