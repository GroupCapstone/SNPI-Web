# GitHub Repository Threat Model Defense Configuration
# Framework Alignment: SLSA v1.0 (Source Integrity) & GitHub Well-Architected Framework
version: '1.0'
repository:
  name: snp-sms-monorepo
  visibility: private
  defaultBranch: main

# Threat Actors Taxonomies (TA-01 to TA-09)
threatActors:
  - id: TA-01
    description: 'Threat actor with Internet access (automated crawlers, opportunistic scrapers)'
    trustBoundary: 'External (Outside Org Trust Boundary)'
  - id: TA-02
    description: 'Threat actor who has a personal GitHub Account'
    trustBoundary: 'External (Outside Org Trust Boundary)'
  - id: TA-03
    description: 'Threat actor who is an outside collaborator on a repository'
    trustBoundary: 'Semi-Trusted (Policy: Prohibit outside collaborators on production repos)'
  - id: TA-04
    description: 'Threat actor who has compromised employee GitHub credentials'
    trustBoundary: 'Compromised Internal Identity (Mitigation: Mandatory 2FA / WebAuthn)'
  - id: TA-05
    description: 'Threat actor who has gained access to employee Okta/SAML session'
    trustBoundary: 'Compromised IdP Session (Mitigation: Short session timeouts & conditional access)'
  - id: TA-06
    description: 'Threat actor who has stolen GitHub token (SSH key, PAT) authenticated to Org'
    trustBoundary: 'Extended Trust Boundary (Mitigation: Fine-grained tokens <=90d expiration)'
  - id: TA-07
    description: 'Threat actor who has compromised a third-party GitHub application'
    trustBoundary: 'Third-Party Integration (Mitigation: Org OAuth app approval policy)'
  - id: TA-08
    description: 'Threat actor who exploited misconfigured/vulnerable GitHub Enterprise app'
    trustBoundary: 'Internal Integration (Mitigation: Principle of least privilege & app audits)'
  - id: TA-09
    description: 'Threat actor who is an insider (mistake, disgruntled employee, contractor)'
    trustBoundary: 'Internal Actor (Mitigation: Dual-control 4-eyes reviews, immutable audit logs)'

# Threat Defenses Matrix (T-01 to T-08)
threatDefenses:
  # T-01: Secret Exposure in Repositories
  t01_secretScanning:
    secretScanningEnabled: true
    pushProtectionEnabled: true
    preCommitScanner: true
    abstractCredentialPolicy: true

  # T-02: Unauthorized Access to Private Repositories
  t02_unauthorizedAccess:
    enforcePrivateVisibility: true
    enterpriseManagedUsers: true
    ipAllowListEnforced: false
    adminOnlyInvitations: true

  # T-03: Abuse or Manipulation of "Danger Zone" Settings
  t03_dangerZoneTamper:
    restrictRepoDeletionToAdmins: true
    restrictRepoTransfer: true
    restrictVisibilityChange: true

  # T-04: Modification or Deletion of Branch History
  t04_branchHistoryProtection:
    blockForcePushes: true
    blockBranchDeletion: true
    enforceLinearHistory: true

  # T-05: Unauthorized Submission of Changes
  t05_unauthorizedMerge:
    requirePullRequest: true
    requiredStatusChecks:
      - 'Pre-Deployment Verification Gate'
      - 'TypeScript Static Analysis'
      - 'ESLint Quality Gate'

  # T-06: Self-Approval and Self-Merge of Pull Requests
  t06_selfApprovalPrevention:
    minimumApprovals: 1
    prohibitAuthorApproval: true
    dismissStaleReviewsOnPush: true
    requireCodeOwnerReviews: true

  # T-07: Account Compromise & Identity Spoofing
  t07_accountAndCommitIntegrity:
    requireTwoFactorAuth: true
    enforceSignedCommits: true
    maxPatDurationDays: 90

  # T-08: Workflow & Action Misconfiguration
  t08_workflowSecurity:
    enforceActionShaPinning: true
    defaultWorkflowPermissions: contents:read
    disallowInsecureScriptInjection: true
