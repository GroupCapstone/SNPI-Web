# Internal Private Endpoints Accessible via Azure VNet Injection
version: '1.0'
environment: enterprise-production

targets:
  database:
    service: mongodb-replica-set
    clusterId: rs0
    connectionStringTemplate: 'mongodb://<REDACTED_INTERNAL_HOST>:27017/snp_sms?replicaSet=rs0'
    ports:
      - 27017
    protocol: TCP
    networkZone: internal-data-tier

  caching:
    service: redis-cluster
    host: 'redis.internal.snpi.edu.kh'
    port: 6379
    protocol: TCP
    networkZone: internal-cache-tier

  containerRegistry:
    service: enterprise-harbor
    host: 'registry.internal.snpi.edu.kh'
    port: 443
    protocol: HTTPS
    networkZone: internal-dmz

  kubernetesControlPlane:
    service: aks-private-api
    host: 'k8s-api.internal.snpi.edu.kh'
    port: 6443
    protocol: HTTPS
    networkZone: internal-k8s-tier

securityPolicies:
  zeroTrustVerification: true
  egressInspection: AzureFirewall
  transitGateway: ExpressRoute
  tlsEnforced: true
