# Declarative CI/CD Execution Continuity Specification
# Reference: Building Resilient CI/CD with GitHub Actions Standard

schema_version: '1.0.0'
standard: 'resilient-cicd-github-actions'

critical_workloads:
  - id: 'snp-sms-frontend'
    name: 'SNP-SMS Next.js Enterprise Web Platform'
    tier: 'Tier-0'
    rto_minutes: 30
    rpo_minutes: 0
    deploy_targets:
      primary: 'vercel-production'
      failover: 'azure-static-web-apps'
    deployment_script: 'infrastructure/resilience/cicd-continuity/alternate-deploy.sh'

  - id: 'snp-sms-backend'
    name: 'SNP-SMS Modular Monolith API'
    tier: 'Tier-0'
    rto_minutes: 15
    rpo_minutes: 0
    deploy_targets:
      primary: 'k8s-production-cluster'
      failover: 'azure-container-apps'
    deployment_script: 'infrastructure/resilience/cicd-continuity/alternate-deploy.sh'

invocation_paths:
  normal_path:
    orchestrator: 'GitHub Actions'
    runner_tier: 'GitHub-hosted / ARC Dedicated Scaleset'
    identity:
      provider: 'GitHub Actions OIDC'
      issuer: 'https://token.actions.githubusercontent.com'
      audience: 'api://AzureADTokenExchange'
      token_ttl_seconds: 900
    approval_mechanism: 'GitHub Environment Protection Rules (Dual Reviewers)'

  alternate_path:
    orchestrator: 'Authorized Incident Responder / Out-of-Band Bastion'
    environment: 'Secure Administrative Jumpbox (Isolated Failure Domain)'
    identity:
      provider: 'Corporate Identity Provider (Azure Entra ID / Okta)'
      mfa_requirement: 'FIDO2 / Hardware Security Key'
      credential_type: 'Just-In-Time (JIT) Privileged Access Role'
      token_ttl_seconds: 1800
      allow_static_secrets: false
    approval_mechanism: 'Out-of-Band Incident Commander + Lead Architect Sign-off'

status_monitoring:
  provider: 'GitHub Status API'
  endpoints:
    summary: 'https://www.githubstatus.com/api/v2/summary.json'
    active_incidents: 'https://www.githubstatus.com/api/v2/incidents/unresolved.json'
    components: 'https://www.githubstatus.com/api/v2/components.json'
    rss_feed: 'https://www.githubstatus.com/history.rss'
  monitored_components:
    - 'Actions'
    - 'Git Operations'
    - 'API Requests'
    - 'Pages'
  polling_interval_seconds: 30

preserved_release_inputs:
  immutable_identifiers:
    commit_sha_length: 40
    container_digest_prefix: 'sha256:'
  provenance:
    attestation_tool: 'gh attestation verify'
    bundle_storage_location: 'infrastructure/resilience/cicd-continuity/attestations/'
    trusted_root_bundle: 'trusted_root.jsonl'
  build_artifacts:
    secondary_registry: 'snpsmscicd.azurecr.io'
    retention_days: 90

reconciliation_protocol:
  mandatory_pre_replay_audit: true
  reconciliation_pr_required: true
  credential_revocation:
    max_duration_post_incident_minutes: 15
    revoke_active_jit_tokens: true
  replay_filters:
    skip_superseded_commits: true
    skip_alternate_deployed_tags: true

rehearsal:
  cadence: 'Quarterly'
  target_environment: 'Staging / Canary'
  modeled_disruptions:
    - 'github_actions_scheduler_unavailability'
    - 'oidc_token_minting_failure'
    - 'runner_infrastructure_offline'
  last_drill_date: '2026-10-15'
  next_drill_date: '2027-01-15'
